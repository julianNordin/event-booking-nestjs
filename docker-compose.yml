services:
  db:
    image: postgres:18-alpine
    container_name: event-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    ports:
      - '5432:5432'
    volumes:
      # postgres:18 sets PGDATA to /var/lib/postgresql/18/docker and declares its
      # volume at /var/lib/postgresql. Mounting /var/lib/postgresql/data — the
      # convention every pre-18 example still shows — leaves the real data
      # directory in the container's writable layer, where `docker compose down`
      # destroys it while the named volume sits empty and looks fine.
      - event-booking-db-data:/var/lib/postgresql
    healthcheck:
      # `migrate deploy` and the test harness both wait on this. pg_isready
      # against the actual database, not just the port, because postgres accepts
      # connections briefly during init and then restarts.
      test: ['CMD-SHELL', 'pg_isready -U events -d events']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Behind a profile, so `docker compose up -d db` — what the README, the test
  # harness and every migration step use — is unaffected by its existence.
  # `docker compose --profile app up` runs the pair.
  api:
    profiles: ['app']
    build:
      context: .
    image: event-booking-nestjs:local
    restart: unless-stopped
    environment:
      # `db`, not localhost: the api resolves the service by name on the compose
      # network, while everything running on the host uses the published port.
      DATABASE_URL: postgresql://events:events@db:5432/events
      # A local placeholder, and the reason the variable has no default in the
      # validator: a service that starts without knowing who may write is
      # fail-open by accident.
      API_KEYS: local:sk_local_development_only
    ports:
      - '3000:3000'
    depends_on:
      db:
        # The entrypoint runs `migrate deploy` before the process starts, and a
        # migration against a database still initialising fails the container.
        condition: service_healthy

volumes:
  event-booking-db-data:
    name: event-booking-db-data
